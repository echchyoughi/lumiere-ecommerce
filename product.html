<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Product — LUMIÈRE</title>
  <meta name="description" content="Premium product details, reviews, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/product.css" />
</head>
<body>
  <header class="navbar scrolled" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">LUMIÈRE</a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link active">Shop</a>
        <a href="shop.html?cat=electronics" class="nav-link">Electronics</a>
        <a href="shop.html?cat=fashion" class="nav-link">Fashion</a>
        <a href="shop.html?cat=accessories" class="nav-link">Accessories</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="search-toggle" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <a href="wishlist.html" class="icon-btn" aria-label="Wishlist">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="badge" id="wishlist-badge">0</span>
        </a>
        <a href="cart.html" class="icon-btn" aria-label="Cart">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="badge" id="cart-badge">0</span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="search-bar" id="search-bar">
      <div class="search-inner">
        <input type="text" id="search-input" placeholder="Search for products..." />
        <button id="search-btn">Search</button>
      </div>
    </div>
  </header>

  <main class="product-main">
    <div class="container">
      <!-- Breadcrumb -->
      <p class="breadcrumb" id="product-breadcrumb"><a href="index.html">Home</a> → <a href="shop.html">Shop</a> → <span id="breadcrumb-name">Product</span></p>

      <!-- Product Detail -->
      <div class="product-detail" id="product-detail">
        <!-- Left: Images -->
        <div class="product-images">
          <div class="main-image-wrap">
            <img id="main-product-img" src="" alt="Product image" class="main-product-img" />
            <div class="img-zoom-hint">🔍 Hover to zoom</div>
          </div>
          <div class="thumb-strip" id="thumb-strip">
            <!-- Thumbnails -->
          </div>
        </div>

        <!-- Right: Info -->
        <div class="product-info">
          <div class="product-badges" id="product-badges"></div>
          <p class="product-category" id="product-category"></p>
          <h1 class="product-name" id="product-name"></h1>
          <div class="product-rating-row">
            <div class="stars" id="product-stars"></div>
            <span class="rating-num" id="product-rating"></span>
            <span class="review-count" id="product-reviews"></span>
          </div>
          <div class="product-price-row">
            <span class="price-current" id="product-price"></span>
            <span class="price-original" id="product-original-price"></span>
            <span class="discount-badge" id="product-discount"></span>
          </div>

          <p class="product-description" id="product-description"></p>

          <!-- Color options -->
          <div class="option-group" id="color-group" style="display:none">
            <label class="option-label">Color: <strong id="selected-color"></strong></label>
            <div class="color-swatches" id="color-swatches"></div>
          </div>

          <!-- Size options -->
          <div class="option-group" id="size-group" style="display:none">
            <label class="option-label">Size: <strong id="selected-size"></strong></label>
            <div class="size-options" id="size-options"></div>
          </div>

          <!-- Quantity -->
          <div class="qty-row">
            <label class="option-label">Quantity</label>
            <div class="qty-control">
              <button class="qty-btn" id="qty-minus" aria-label="Decrease quantity">−</button>
              <input type="number" id="qty-input" value="1" min="1" max="99" class="qty-input" />
              <button class="qty-btn" id="qty-plus" aria-label="Increase quantity">+</button>
            </div>
            <span class="stock-info" id="stock-info"></span>
          </div>

          <!-- CTA Buttons -->
          <div class="product-ctas">
            <button class="btn btn-primary btn-lg" id="add-to-cart-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              Add to Cart
            </button>
            <button class="btn btn-secondary btn-lg" id="buy-now-btn">Buy Now</button>
            <button class="icon-btn wishlist-btn" id="wishlist-btn" aria-label="Add to wishlist" title="Add to wishlist">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
          </div>

          <!-- Product meta -->
          <div class="product-meta">
            <div class="meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
              Free shipping on orders over $100
            </div>
            <div class="meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              30-day free returns
            </div>
            <div class="meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              2-year manufacturer warranty
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs: Description / Specs / Reviews -->
      <div class="product-tabs">
        <div class="tab-headers">
          <button class="tab-btn active" data-tab="description" id="tab-description">Description</button>
          <button class="tab-btn" data-tab="specs" id="tab-specs">Specifications</button>
          <button class="tab-btn" data-tab="reviews" id="tab-reviews">Reviews</button>
        </div>
        <div class="tab-content" id="tab-content-description">
          <p id="full-description"></p>
        </div>
        <div class="tab-content hidden" id="tab-content-specs">
          <table class="specs-table" id="specs-table"></table>
        </div>
        <div class="tab-content hidden" id="tab-content-reviews">
          <div class="reviews-summary">
            <div class="reviews-big-rating" id="reviews-big-rating"></div>
            <div class="reviews-breakdown" id="reviews-breakdown"></div>
          </div>
          <div class="reviews-list" id="reviews-list"></div>
        </div>
      </div>

      <!-- Related Products -->
      <div class="related-section">
        <div class="section-header">
          <p class="section-eyebrow">You May Also Like</p>
          <h2 class="section-title">Related Products</h2>
        </div>
        <div class="products-grid" id="related-grid"></div>
      </div>
    </div>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 LUMIÈRE. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
